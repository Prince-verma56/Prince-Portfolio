# docker-compose.yml — Prince Portfolio
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   Development (hot-reload):  docker compose --profile dev up
#   Production:                docker compose --profile prod up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Development server (mirrors `npm run dev`) ────────────────────────────
  portfolio-dev:
    profiles: [dev]
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules          # preserve container's node_modules
      - /app/.next                 # preserve build cache
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    env_file:
      - .env.local
    command: sh -c "npm install && npm run dev"

  # ── Production server (optimised multi-stage build) ───────────────────────
  portfolio-prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    # Override EMAIL_* at runtime — never bake secrets into the image
    env_file:
      - .env.local
    restart: unless-stopped
    # Healthcheck: confirm the app is responding
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
